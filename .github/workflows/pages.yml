name: GitHub Pages

on:
  push:
    branches: ["claude/fachwirt-logistik-exam-app-y5z8io"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Pages einrichten
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Seite zusammenstellen
        run: |
          mkdir -p _site
          cp index.html styles.css app.js manifest.webmanifest sw.js .nojekyll _site/
          cp -r data icons _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
